[package]
name = "hasher"
version = "1.0.0"
edition = "2021"

[lib]
name = "hasher_lib"
crate-type = ["lib"]

[[bin]]
name = "hasher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
tokio = { version = "1", features = ["rt"] }
memmap2 = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
