<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Hasher</title>
  <script>
    // Apply theme synchronously before first paint to prevent flash;
    // also lock transitions until JS init removes the class.
    (function(){var d=document.documentElement,t=localStorage.getItem('hasher-theme');if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';d.setAttribute('data-theme',t);d.classList.add('no-transition')})();
  </script>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-brand">
        <svg class="app-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="4.5" fill="var(--accent)"/>
          <text x="12" y="16.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="800" fill="white">#</text>
        </svg>
        <div class="brand-text"><h1>Hasher</h1><span class="app-version">v1.0.0</span></div>
      </div>
      <div class="header-actions">
        <button id="clear-btn" data-i18n-title="clearAll" title="Clear All" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 3l7 7-11 11H2v-7L13 3z"/><path d="M2 21h20"/>
          </svg>
        </button>
        <button id="collapse-all-btn" title="Collapse/Expand all" disabled>
          <svg class="icon-collapse" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 13 12 18 17 13"/><polyline points="7 6 12 11 17 6"/>
          </svg>
          <svg class="icon-expand" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 11 12 6 17 11"/><polyline points="7 18 12 13 17 18"/>
          </svg>
        </button>
        <button id="case-btn" title="Toggle hash case">
          <svg class="icon-lower" width="20" height="20" viewBox="0 0 24 24">
            <text x="12" y="18.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="500" fill="currentColor">a</text>
          </svg>
          <svg class="icon-upper" width="20" height="20" viewBox="0 0 24 24">
            <text x="12" y="18.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="500" fill="currentColor">A</text>
          </svg>
        </button>
        <button id="lang-btn" title="Switch language">
          <svg class="icon-lang-en" width="20" height="20" viewBox="0 0 24 24">
            <text x="12" y="18" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="500" fill="currentColor">En</text>
          </svg>
          <svg class="icon-lang-zh" width="20" height="20" viewBox="0 0 24 24">
            <text x="12" y="18.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="500" fill="currentColor">&#x4e2d;</text>
          </svg>
        </button>
        <button id="theme-btn" data-i18n-title="toggleTheme" title="Toggle theme">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button id="settings-btn" data-i18n-title="settings" title="Settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div id="drop-zone">
        <div class="drop-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
        <p class="drop-text" data-i18n="dropText">Drop or click to select files</p>
        <p class="drop-subtext" data-i18n="dropSubtext">Supports multiple files at once</p>
      </div>

      <div id="file-list"></div>
    </main>

    <div id="settings-overlay" class="hidden">
      <div id="settings-modal">
        <h2 data-i18n="hashAlgorithms">Hash Algorithms</h2>
        <div class="setting-item">
          <span class="setting-label">MD5</span>
          <input type="checkbox" class="toggle-switch" id="toggle-md5" />
        </div>
        <div class="setting-item">
          <span class="setting-label">SHA-1</span>
          <input type="checkbox" class="toggle-switch" id="toggle-sha1" />
        </div>
        <div class="setting-item">
          <span class="setting-label">SHA-256</span>
          <input type="checkbox" class="toggle-switch" id="toggle-sha256" />
        </div>
        <div class="setting-item">
          <span class="setting-label">SHA-512</span>
          <input type="checkbox" class="toggle-switch" id="toggle-sha512" />
        </div>
        <button id="settings-close" data-i18n="done">Done</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
