name: Build Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust (aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Tauri (macOS ARM)
        run: npx tauri build --target aarch64-apple-darwin

      - name: Rename artifact
        run: |
          VERSION=${TAG#v}
          MIN_MACOS=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['bundle']['macOS']['minimumSystemVersion'].split('.')[0])")
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "Hasher_macOS${MIN_MACOS}_arm64_${VERSION}.dmg"
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.inputs.tag || github.event.release.tag_name }} Hasher_macOS*_arm64_*.dmg --clobber

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri (Windows)
        run: npx tauri build --bundles nsis

      - name: Rename artifact
        run: |
          $VERSION = "${{ github.event.inputs.tag || github.event.release.tag_name }}".TrimStart("v")
          $META = Get-Content build-meta.json | ConvertFrom-Json
          $MIN_WIN = $META.windows.minVersion
          $ARCH = $META.windows.arch
          copy src-tauri\target\release\hasher.exe "Hasher_${MIN_WIN}_${ARCH}_${VERSION}.exe"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.inputs.tag || github.event.release.tag_name }} Hasher_*_*_*.exe --clobber
